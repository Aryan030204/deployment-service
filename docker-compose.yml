version: "3.8"

services:
  deployment-service:
    build:
      context: .
      dockerfile: services/deployment-service/Dockerfile
    restart: unless-stopped
    ports:
      - "8002:8001"
    env_file:
      - .env
    networks:
      - shared-net
  deployment-worker:
    build:
      context: .
      dockerfile: services/deployment-service/Dockerfile
    restart: unless-stopped
    command: ["python", "main_worker.py"]
    # Explicit ceiling so an OOM shows up as `OOMKilled=true` in `docker inspect`.
    # Tune to the host; with windowed backfill, ~2g per parallel worker is a sane start.
    mem_limit: ${WORKER_MEM_LIMIT:-4g}
    env_file:
      - .env
    networks:
      - shared-net

networks:
  shared-net:
    external: true
